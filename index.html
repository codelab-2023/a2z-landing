  <!-- Security Script: Protect content while allowing seamless form input/pasting -->
  <script>
    // Disable context menu outside form elements
    document.addEventListener('contextmenu', function (e) {
      if (e.target.closest('input, textarea, select, [contenteditable="true"]')) {
        return true;
      }
      e.preventDefault();
    });

    // Disable developer tools shortcut keys to deter basic scraping
    document.addEventListener('keydown', function (e) {
      // F12
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
      // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Inspect / Console / Inspector)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) {
        e.preventDefault();
        return false;
      }
      // Ctrl+U (View Source)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) {
        e.preventDefault();
        return false;
      }
      // Ctrl+S (Save Page)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) {
        e.preventDefault();
        return false;
      }
    });
  </script>

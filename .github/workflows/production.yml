name: Production

# Trigger the workflow on push and pull request events on the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Initializing:
    runs-on: ubuntu-latest
    # job-level guard: only run if we're on main branch
    if: github.ref == 'refs/heads/main'
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Deploy to server via SSH
      - name: Create ENV & Fetch Latest Code
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          port: 22
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Navigate to project directory
            cd /home/a2z/a2z-landing
            
            # Generate dynamic version (YY.MM.DD)
            APP_VERSION=$(date +"%y.%m.%d")
            echo "📌 App Version: $APP_VERSION"
        
            # Backup or create .env
            echo "📦 === Backup/Create .env ==="
            if [ -f .env ]; then
              mv .env .env.bak
              echo "💾 Existing .env backed up"
            fi

            cat > .env <<EOL
            
            REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND_URL }}
            REACT_APP_VERSION=$APP_VERSION
            EOL
            echo "📝 .env file created/replaced"
            
            # Pull latest code safely
            echo "🔄 === Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Code updated"

  Installing:
    runs-on: ubuntu-latest
    needs: [Initializing]
    # job-level guard: only run if we're on main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Installing Dependencies
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          port: 22
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Navigate to project directory
            cd /home/a2z/a2z-landing
            
            # 📥 === Checking Bun existence ===
            if ! command -v bun &> /dev/null; then
              # ⚠️ Bun not found, installing...
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi
            
            # 📥 === Installing dependencies ===
            bun i

  Building:
    runs-on: ubuntu-latest
    needs: [Installing]
    # job-level guard: only run if we're on main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Building Project
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          port: 22
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Navigate to project directory
            cd /home/a2z/a2z-landing
            bun run build

  Deploying:
    runs-on: ubuntu-latest
    needs: [Building]
    # job-level guard: only run if we're on main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Moving Dist Folder To WEB
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          port: 22
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Remove existing dist folder and move new build
            rm -rf /var/www/web
            mv /home/a2z/a2z-landing/dist /var/www/web